name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "setuptools>=75" "pytest>=8.3"
      - run: python -m pip wheel --no-build-isolation --no-deps --wheel-dir dist .
      - run: python -m pip install --no-index --no-deps --force-reinstall dist/agent_workflow-0.1.0-py3-none-any.whl
      - run: python -m pytest -v
      - run: python tests/installed_cli_smoke.py
