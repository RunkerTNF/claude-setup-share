name: release-check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-check:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test and build requirements
        run: python -m pip install "setuptools>=75" "pytest>=8.3"
      - name: Install package from source
        run: >-
          python -m pip install
          --no-build-isolation
          --no-deps
          --force-reinstall
          .
      - name: Run release gate
        run: python scripts/release_check.py --artifact-dir dist
      - name: Upload deterministic release artifact
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: agent-workflow-pyz
          if-no-files-found: error
          path: |
            dist/agent-workflow.pyz
            dist/agent-workflow.pyz.sha256
